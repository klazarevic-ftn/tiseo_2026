<h1>Profil</h1>

@if (profile(); as data) {
  <p><strong>Ime:</strong> {{ data.user.firstName }}</p>
  <p><strong>Prezime:</strong> {{ data.user.lastName }}</p>
  <p><strong>Email:</strong> {{ data.user.email }}</p>

  @for (student of data.students; track student.id) {
    <p><strong>Broj indeksa:</strong> {{ student.index }}</p>
  }
} @else if (error()) {
  <p>{{ error() }}</p>
} @else {
  <p>Učitavanje...</p>
}
